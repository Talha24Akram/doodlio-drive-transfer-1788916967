name: Doodlio Drive Transfer
on:
  workflow_dispatch:
jobs:
  transfer:
    runs-on: [self-hosted, doodlio-transfer]
    steps:
      - name: Stage final Doodlio POC
        run: |
          cp /home/talha/AI/motion-doodle-studio/demo/doodlio-poc-defense-final.mp4 ./doodlio-poc-defense-final.mp4
          test "$(stat -c %s doodlio-poc-defense-final.mp4)" -eq 3175867
      - name: Upload transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: doodlio-poc-defense-final
          path: doodlio-poc-defense-final.mp4
          compression-level: 0
          retention-days: 1
